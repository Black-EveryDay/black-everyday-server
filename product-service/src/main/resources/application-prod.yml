spring:
  application:
    name: product-service
  datasource:
    url:
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    open-in-view: false

  data:
    redis:
      host:
      port:
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

server:
  port: 19094


eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/