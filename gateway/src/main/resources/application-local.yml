server:
  port: 19091

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        # auth
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        # product-service
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
        # order-service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        # payment-service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        # event-service
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/v1/events/**
      discovery:
        locator:
          enabled: true  # 서비스 디스커버리를 통해 동적으로 라우트를 생성하도록 설정

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/  # Eureka 서버의 URL을 지정

service:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
  gateway:
    secret-key: ${GATEWAY_SECRET_KEY}